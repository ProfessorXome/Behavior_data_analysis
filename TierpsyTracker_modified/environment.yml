# Exact package versions of the `tierpsy` conda environment used to run the
# modified Tierpsy Tracker in tierpsy-tracker/ (recorded 2026-11-25 on macOS,
# Apple silicon / osx-arm64). Tierpsy itself is not listed here: it is
# installed from tierpsy-tracker/ after the environment is created.
# See INSTALL_INSTRUCTIONS.txt.
name: tierpsy
channels:
  - conda-forge
