# Exact package versions of the `ht_flip` conda environment used to run the
# head/tail flip-range annotation tool (flip_range_tool.py) in this folder
# (recorded 2026-11-25 on macOS, Apple silicon / osx-arm64).
#
# Create it with:
#   conda env create -f environment.yml
#   conda activate ht_flip
#
# Python and its low-level libraries come from conda-forge; all other packages
# are installed by pip at the exact versions listed below.
name: ht_flip
channels:
  - conda-forge
dependencies:
  - packaging=26.4
  - pip=26.2.2
  - python=3.11.18
  - setuptools=84.2.1
  - wheel=0.48.0
  # System libraries installed alongside Python (as recorded on osx-arm64).
  # On other platforms, delete these lines if conda cannot resolve them;
  # conda will then pick the matching libraries for python above.
  - bzip2=1.0.8
  - ca-certificates=2026.11.20
  - libexpat=2.9.0
  - libffi=3.7.0
  - liblzma=5.8.3
  - libpython=3.11.18
  - libsqlite=3.54.1
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.5
  - readline=8.3
  - tk=8.6.13
  - pip:
      - contourpy==1.3.3
      - cycler==0.12.1
      - fonttools==4.69.1
      - h5py==3.16.0
      - kiwisolver==1.5.1
      - matplotlib==3.11.1
      - numpy==2.4.6
      - pandas==3.0.5
      - pillow==13.0.0
      - pyparsing==3.3.3
      - python-dateutil==4.0.0
      - tzdata==2026.6
